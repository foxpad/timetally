services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: picktime
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: Gfhjkm123.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d picktime"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Серверная часть (FastAPI)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_PATH=${WEBHOOK_PATH}
      - DB_URL=${DB_URL}
      - CLIENT_URL=${CLIENT_URL}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app
      - server_temp:/app/temp
    restart: unless-stopped

  # Клиентская часть (React/Vite)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_DEFAULT_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
  server_temp:
